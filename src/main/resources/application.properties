# APPLICATION
spring.application.name=GOATSPORTS-EUREKA-SERVER
spring.threads.virtual.enabled=false
spring.main.banner-mode=off
spring.main.log-startup-info=false
server.port=${SERVER_PORT}
# Eureka Server
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME}
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
## Actuator
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=false
management.endpoint.health.probes.enabled=true
management.endpoint.health.status.http-mapping.UP=200
management.endpoint.health.status.http-mapping.DOWN=503
## Logging
logging.level.root=INFO
logging.level.me.minhdat=DEBUG
logging.level.com.netflix=ERROR
logging.level.com.netflix.eureka=WARN
logging.level.org.springframework.cloud.netflix.eureka=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n